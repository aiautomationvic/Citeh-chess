[data-theme=mint]{--bg1:#f6fcf9;--bg2:#e0f3ea;--card:#fff;--line:#d3e8de;--txt:#0f2f26;--dim:#5b7f71;--chip:#edf7f2;--blue:#1d9a76;--blue2:#157a5d;--g1:#1d9a76;--g2:#1d9a76}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
h1{font-size:21px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center}h1 span:not(.logo){color:var(--blue);margin-left:.28em}
.logo{display:inline-flex;width:34px;height:34px;border-radius:10px;background:#0f1f3a;margin-right:10px;align-items:center;justify-content:center;flex:none}.logo svg{width:25px;height:25px}[data-theme=night] .logo{background:#1d3157}
.top{margin:4px 0 16px}
button{background:var(--g1);border:0;box-shadow:none;border-radius:12px;min-height:46px;font-weight:600;letter-spacing:0;padding:0 18px;transition:opacity .12s,transform .12s}
button:active{transform:scale(.98);filter:none;opacity:.86;box-shadow:none}
button.alt{background:var(--surf);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.gear{width:42px;min-width:42px;min-height:42px;border-radius:12px;padding:0;background:var(--surf);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(15,31,58,.04)}
.card>b:first-child{font-size:12px;letter-spacing:.07em;font-weight:600;color:var(--dim);margin-bottom:12px}
.seg{background:var(--chip);border:0;border-radius:12px;padding:3px}
.seg button{min-height:40px;border-radius:10px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--surf);color:var(--txt);box-shadow:0 1px 2px rgba(15,31,58,.12)}
.swt{background:#cfd8e5;box-shadow:none}.swt.on{background:var(--g1)}[data-theme=night] .swt{background:#2a3d63}
.rt b{color:var(--txt);font-size:20px;font-weight:700}.rt small{font-weight:500}
input{border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--txt)}input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.pl{padding:10px 2px;font-weight:600}.pl small{font-weight:500;color:var(--dim);margin-left:4px}
.av{width:28px;height:28px;border-radius:8px;font-size:13px;box-shadow:none;margin-right:10px}
.clk{min-width:84px;border-radius:10px;font-size:19px;font-weight:700;background:var(--surf);border:1px solid var(--line);color:var(--txt);box-shadow:none}
.clk.run{background:#0f1f3a;border-color:#0f1f3a;color:#fff;box-shadow:none}[data-theme=night] .clk.run{background:#e9eef8;color:#0c1830;border-color:#e9eef8}
#bw{filter:none;z-index:1}#bd{border:4px solid var(--surf);border-radius:12px;box-shadow:0 1px 2px rgba(15,31,58,.08),0 10px 28px rgba(15,31,58,.10)}
.sel{box-shadow:inset 0 0 0 100px #f2cf4a99}.lm{box-shadow:inset 0 0 0 100px #f2cf4a5c}
.nav button{background:var(--surf);color:var(--txt);border:1px solid var(--line)}.nav button:disabled{opacity:.4}
#mlist{border:1px solid var(--line);border-radius:12px;background:var(--surf);box-shadow:none}
#mlist .mv{background:var(--chip);border-radius:8px;font-weight:600;color:var(--txt)}#mlist .mv.cur{background:#0f1f3a;color:#fff}[data-theme=night] #mlist .mv.cur{background:#e9eef8;color:#0c1830}
#mlist .mn{color:var(--dim)}
.evb{height:8px;border-radius:4px;background:#1b2a44}
.sum b{color:var(--txt)}
table.cl th,table.cl td{font-weight:600}
.sheet{border-radius:20px 20px 0 0;background:var(--surf)}.sheet::before{background:var(--line)}
.opt{border-bottom:1px solid var(--line)}
.pcb{background:var(--chip);border:2px solid transparent;color:var(--txt);box-shadow:none}.pcb.s2{border-color:var(--blue);background:var(--surf)}
.swb{box-shadow:0 0 0 1px var(--line);border-color:var(--surf)}.swb.s2{box-shadow:0 0 0 2px var(--blue)}
#toast{background:#0f1f3a;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#promo{background:rgba(11,19,36,.7)}#promo button{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:none}
#opn{font-weight:600}
#st{font-weight:600;color:var(--dim)}
.dim,small{color:var(--dim)}
#mlist{position:relative}
#ctl{flex-wrap:nowrap}#ctl button{min-width:0;padding:0 6px}
#zb{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:6;opacity:.55}
body.zen #zb{display:flex}
body.zen .top,body.zen #opn,body.zen #mk,body.zen .nav,body.zen #mlist,body.zen #lv,body.zen #ana,body.zen .pl small,body.zen .co{display:none}
body.zen #st{display:none}body.zen.over #st{display:block}
body.zen{padding-top:calc(34px + env(safe-area-inset-top))}
body.fill{padding-left:0;padding-right:0;max-width:none}
body.fill #bd{border-radius:0;border-left-width:0;border-right-width:0}
body.fill .pl,body.fill #side>*{margin-left:12px;margin-right:12px}body.fill #side>.card,body.fill #side>.row{margin-left:12px;margin-right:12px}
@media (min-width:760px){
 body.gw{max-width:1180px}
 body.gw #game{display:grid;grid-template-columns:minmax(0,1fr) 380px;column-gap:26px;align-items:start}
 body.gw #game>.pl:first-child{grid-column:1;grid-row:1}
 body.gw #bw{grid-column:1;grid-row:2;width:min(100%,max(300px,calc(100dvh - 190px)))}
 body.gw #game>.pl:nth-child(3){grid-column:1;grid-row:3}
 body.gw #side{grid-column:2;grid-row:1/span 3}
 body.gw #mlist{flex-wrap:wrap;overflow-x:hidden;overflow-y:auto;max-height:280px;white-space:normal;align-content:flex-start}
 body.gw.zen #game{grid-template-columns:1fr}body.gw.zen #side{grid-column:1;grid-row:4}
 body.gw.zen #bw{width:min(100%,max(300px,calc(100dvh - 210px)))}
}
