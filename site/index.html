const inB=(r,f)=>r>=0&&r<8&&f>=0&&f<8,isW=p=>p!='.'&&p==p.toUpperCase();

const fmt=ms=>{if(ms==null)return'--';ms=Math.max(0,ms);return ms<10000?(ms/1000).toFixed(1):Math.floor(ms/60000)+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')}
function clocks(){if(!G||!G.me)return;const run=live()&&G.moves.length>=2,el=Date.now()-G.t0,t=turn();
 const w=G.wt!=null?G.wt-(run&&t=='white'?el:0):null,b=G.bt!=null?G.bt-(run&&t=='black'?el:0):null,mw=bcol()=='white';
 $('#mc').textContent=fmt(mw?w:b);$('#oc').textContent=fmt(mw?b:w);
 $('#mc').classList.toggle('run',run&&t==bcol());$('#oc').classList.toggle('run',run&&t!=bcol())}
setInterval(clocks,200);
addEventListener('keydown',e=>{if(G&&!$('#game').classList.contains('hide')){if(e.key=='ArrowLeft')go(G.V-1);if(e.key=='ArrowRight')go(G.V+1)}});
// ---------- input: tap and drag ----------
const bd=$('#bd');let drg=null;
function sqAt(x,y){const R=bd.getBoundingClientRect(),c=Math.floor((x-R.left)/R.width*8),w=Math.floor((y-R.top)/R.height*8);if(c<0||c>7||w<0||w>7)return null;const fl=bcol()=='black';return[fl?7-w:w,fl?7-c:c]}
function mkGhost(p,x,y){const g=$('#gh');g.innerHTML=glyph(p);g.classList.remove('hide');moveGhost(x,y);const s=bd.querySelector(`[data-r="${drg.r}"][data-f="${drg.f}"] .g`);if(s)s.style.opacity=.3}
function moveGhost(x,y){const g=$('#gh');g.style.left=x+'px';g.style.top=y+'px'}
function cancelDrag(){drg=null;$('#gh').classList.add('hide')}
bd.addEventListener('pointerdown',e=>{if(!G||!G.me||!(canMove()||canPre()))return;const s=sqAt(e.clientX,e.clientY);if(!s)return;const[r,f]=s,p=B[r][f];
 if(sel&&!mine(p)){const t=sel;sel=null;hl=[];tryMove(t,s);return}
 if(mine(p)){sel=[r,f];hl=lg(cur(),r,f);drg={r,f,p,x:e.clientX,y:e.clientY,mv:false};try{bd.setPointerCapture(e.pointerId)}catch{}render()}else{sel=null;hl=[];pm=null;render()}});
bd.addEventListener('pointermove',e=>{if(!drg)return;if(!drg.mv&&Math.hypot(e.clientX-drg.x,e.clientY-drg.y)>8){drg.mv=true;mkGhost(drg.p,e.clientX,e.clientY)}if(drg.mv)moveGhost(e.clientX,e.clientY)});
bd.addEventListener('pointerup',e=>{if(!drg)return;const d=drg;cancelDrag();if(d.mv){const s=sqAt(e.clientX,e.clientY);if(s&&(s[0]!=d.r||s[1]!=d.f)){sel=null;hl=[];G.noAnim=true;tryMove([d.r,d.f],s)}else{sel=null;hl=[];render()}}});
bd.addEventListener('pointercancel',()=>{cancelDrag();render()});
const lg=(P,r,f)=>canMove()?legal(P,r,f):pseudo(P,r,f);
function setPre(a,b,u){pm={a,b,u};sel=null;hl=[];render()}
function firePre(){if(!pm)return;if(!live()||G.analysis){pm=null;return}if(turn()!=G.me||G.V!=G.moves.length)return;const x=pm;pm=null;if(legal(cur(),x.a[0],x.a[1]).some(m=>m[0]==x.b[0]&&m[1]==x.b[1]))setTimeout(()=>{if(live()&&turn()==G.me)play(x.u)},30);else toast('Premove cancelled')}
function tryMove(a,b){const L=lg(cur(),a[0],a[1]);if(!L.some(m=>m[0]==b[0]&&m[1]==b[1])){toast(canMove()?'Not a legal move':"Can't premove there");return render()}
 const p=B[a[0]][a[1]],u='abcdefgh'[a[1]]+(8-a[0])+'abcdefgh'[b[1]]+(8-b[0]);
 if(!canMove())return setPre(a,b,u+(p.toLowerCase()=='p'&&(b[0]==0||b[0]==7)?'q':''));
 if(p.toLowerCase()=='p'&&(b[0]==0||b[0]==7)){if(S.aq)return play(u+'q');const pr=$('#promo');pr.classList.remove('hide');pr.innerHTML=['q','r','b','n'].map(x=>`<button onclick="pick('${u}${x}')">${glyph(isW(p)?x.toUpperCase():x)}</button>`).join('');return render()}
 play(u)}
function pick(u){$('#promo').classList.add('hide');play(u)}
function play(u){if(G.analysis)return playAn(u);const c0=cnt(cur());G.moves.push(u);G.pend=u;extend();G.V=G.moves.length;sel=null;hl=[];beep(cnt(cur())<c0);render();send(u)}
function undo(u){if(G.pend!=u)return;G.pend=null;G.moves.pop();G.pos.length=G.moves.length+1;G.san.length=G.moves.length;G.V=G.moves.length;render()}
async function send(u){try{const r=await fetch(`${API}/api/board/game/${G.id}/move/${u}`,{method:'POST',headers:H()});if(!r.ok){toast('Move rejected');undo(u)}}catch{toast('No connection');undo(u)}}
const act=p=>fetch(`${API}/api/board/game/${G.id}/${p}`,{method:'POST',headers:H()});
function resign(){if(G.moves.length>=2&&S.cr&&live()&&!confirm('Resign this game?'))return;act(G.moves.length<2?'abort':'resign')}
function draw(){act('draw/yes');toast(G.offer?'Draw accepted':'Draw offered')}
function lobbyBack(){pm=null;stopAna();G=null;B=null;cancelDrag();if(gAbort)gAbort.abort();lobby()}
// ---------- settings ----------
function applyS(){document.documentElement.style.setProperty('--ad',({fast:130,normal:230,slow:420})[S.sp]+'ms');document.documentElement.dataset.theme=S.th;const t=BT[S.bt]||BT.sky,r=document.documentElement.style;r.setProperty('--sqL',t[0]);r.setProperty('--sqD',t[1])}
function setS(k,v){S[k]=v;ls.s('bcSet',JSON.stringify(S));applyS();renderSet();if(G&&B)render()}
function toggleSet(v){$('#set').classList.toggle('hide',!v);if(v)renderSet()}
const AN=()=>`<div class="seg g5">${[['none','Off'],['slide','Slide'],['hop','Hop'],['bounce','Bounce'],['fade','Pop']].map(([k,n])=>`<button class="${S.an==k?'on':''}" onclick="setS('an','${k}');demoAn()">${n}</button>`).join('')}</div><div class="seg g3" style="margin:8px 0 6px">${[['fast','Fast'],['normal','Normal'],['slow','Slow']].map(([k,n])=>`<button class="${S.sp==k?'on':''}" onclick="setS('sp','${k}')">${n}</button>`).join('')}</div>`;
function demoAn(){if(G&&G.moves.length&&G.me){G.noAnim=false;G.pvV=Math.max(0,G.V-1);render()}}
const EN=()=>`<div class="seg">${[['sf10','Standard'],['sf19','Strong']].map(([k,n])=>`<button class="${engKey()==k?'on':''}" onclick="setS('eng','${k}')">${n}</button>`).join('')}</div><div class="seg g3" style="margin:8px 0 6px">${[[12,'Quick'],[14,'Normal'],[18,'Deep']].map(([d,n])=>`<button class="${S.dp==d?'on':''}" onclick="setS('dp',${d})">${n}</button>`).join('')}</div>`;
function renderSet(){const sec=t=>`<div class="opt" style="border:0;padding-bottom:2px">${t}</div>`,sw=(o,key)=>`<div class="sws">${Object.entries(o).map(([k,t])=>`<button class="swb ${k==S[key]?'s2':''}" style="background:linear-gradient(135deg,${t[0]} 50%,${t[1]} 50%)" onclick="setS('${key}','${k}')"></button>`).join('')}</div>`;
 $('#sbody').innerHTML=sec('Theme')+sw(TH,'th')+sec('Board colour')+sw(BT,'bt')+sec('Piece style')+`<div class="pcs">${Object.entries(PS).map(([k,n])=>`<button class="pcb ${k==S.pc?'s2':''}" onclick="setS('pc','${k}')"><span class="pv">${pv(k)}</span>${n}</button>`).join('')}</div>`+sec('Piece animation')+AN()+sec('Analysis engine')+EN()+
 [['pm','Premoves'],['co','Show coordinates'],['lm','Highlight last move'],['ht','Show legal move dots'],['snd','Move sounds'],['vib','Vibrate on move'],['aq','Auto-queen promotions'],['cr','Confirm before resigning']].map(([k,l])=>`<div class="opt"><span>${l}</span><button class="swt ${S[k]?'on':''}" onclick="setS('${k}',${!S[k]})" aria-label="${l}"><i></i></button></div>`).join('')}
function beep(cap){if(S.vib&&navigator.vibrate)navigator.vibrate(cap?30:12);if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=cap?300:520;g.gain.setValueAtTime(.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.13)}catch{}}
applyS();boot();
</script></body></html>
